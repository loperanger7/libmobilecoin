name: Build xcframework

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      # macos-14 runners ship CMake 4.x, which dropped support for
      # cmake_minimum_required < 3.5 used in vendored rust-mbedtls.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init Vendor/mobilecoin submodule (shallow)
        run: |
          git config --global submodule.Artifacts.update none
          git submodule update --init --depth=1 Vendor/mobilecoin

      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(cat libmobilecoin/rust-toolchain)
          echo "Installing $TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
          rustup component add llvm-tools-preview rust-src
          cargo install cargo-binutils --locked

      - name: Install build tools (cbindgen + protoc)
        run: brew install cbindgen protobuf

      - name: Patch CMake
        run: ./tools/patch-cmake.sh

      - name: Build static libs (5 Apple archs)
        run: make build

      - name: Lipo + xcframework assembly
        run: make clean-artifacts copy

      - name: Verify partial-fill symbol present
        run: |
          set -euo pipefail
          SYM="mc_transaction_builder_add_presigned_partial_fill_input"
          MISSING=0
          # nm may fail on LTO/bitcode archives; fall back to strings on archive contents.
          for slice in Artifacts/target/*/release/libmobilecoin.a; do
            echo "--- $slice ---"
            echo "  nm -gU output (stderr visible):"
            nm -gU "$slice" 2>&1 | grep "add_presigned" || echo "    (no nm matches)"
            if nm -gU "$slice" 2>/dev/null | grep -q "$SYM"; then
              echo "  OK (nm): $SYM present"
            elif strings "$slice" | grep -q "$SYM"; then
              echo "  OK (strings): $SYM present in archive"
            else
              echo "  FAIL: $SYM missing"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          echo "OK: partial-fill symbol present in all per-arch slices"

      - name: Zip xcframework
        working-directory: Artifacts
        run: zip -r LibMobileCoinLibrary.xcframework.zip LibMobileCoinLibrary.xcframework

      - name: Compute SPM checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum Artifacts/LibMobileCoinLibrary.xcframework.zip)
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          {
            echo "## Build artifact"
            echo ""
            echo "**SPM checksum**: \`$CHECKSUM\`"
            echo ""
            echo "**Tag**: \`kyoto-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="kyoto-${GITHUB_SHA::7}"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/LibMobileCoinLibrary.xcframework.zip"
          NOTES=$(cat <<EOF
          Patched libmobilecoin xcframework with the
          \`mc_transaction_builder_add_presigned_partial_fill_input\` C FFI binding,
          required for iOS DEQS partial-fill swap support.

          Built from commit ${GITHUB_SHA}.

          ## SPM consumer snippet

          \`\`\`swift
          .binaryTarget(
              name: "LibMobileCoinLibrary",
              url: "$URL",
              checksum: "${{ steps.checksum.outputs.checksum }}"
          )
          \`\`\`
          EOF
          )
          gh release create "$TAG" \
            Artifacts/LibMobileCoinLibrary.xcframework.zip \
            --title "$TAG (partial-fill FFI)" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
